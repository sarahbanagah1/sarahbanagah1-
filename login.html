<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | عيادتي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="logo">🏥 عيادتي</a>
      <h1>تسجيل الدخول</h1>
      <p class="auth-subtitle">أدخل بياناتك للوصول إلى حسابك</p>

      <form id="loginForm">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">دخول</button>
      </form>

      <p class="auth-footer">
        ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a>
      </p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
